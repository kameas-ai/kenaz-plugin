<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="kenaz-csrf" content="{{.CSRF}}">
<title>Kenaz approvals</title>
<link rel="stylesheet" href="/approvals/static/style.css">
</head>
<body>
<main>
  <h1>Kenaz approvals</h1>
  <p class="lede">{{.Lede}}</p>

  <section id="request" hidden>
    <h2 id="r-op"></h2>
    <p id="r-summary" class="summary"></p>
    <p id="r-impact" class="impact" hidden></p>
    <ol id="r-details" class="details" hidden></ol>
    <div class="actions" id="r-actions">
      <button id="approve" type="button">{{.Approve}}</button>
      <button id="deny" type="button" class="secondary">{{.Decline}}</button>
    </div>
    <dl>
      <dt>Status</dt><dd id="r-status"></dd>
      <dt>Account</dt><dd id="r-account"></dd>
      <dt>Destination</dt><dd id="r-targets"></dd>
      <dt>Expires</dt><dd id="r-expires"></dd>
    </dl>
    <details id="r-exact">
      <summary>Exact content</summary>
      <pre id="r-payload"></pre>
      <p class="hash">SHA-256 <code id="r-hash"></code></p>
    </details>
    <p id="r-result" class="result" hidden></p>
  </section>

  <section id="list" hidden>
    <ul id="l-items"></ul>
    <p id="l-empty" hidden>Nothing is waiting.</p>
  </section>

  <p id="message" class="message" role="status"></p>
</main>
<script src="/approvals/static/app.js"></script>
</body>
</html>
