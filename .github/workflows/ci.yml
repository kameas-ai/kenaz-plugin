name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Public CI builds and tests the unofficial (stub) flavor only.
      # Official builds are produced separately.
      - run: make check
      - run: make build
      - run: ./bin/kenaz --version | grep -q "unofficial build"
